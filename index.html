
<!DOCTYPE html>
<html lang="pt">
<head>
  
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <meta charset="UTF-8">
  <title>Anúncio de Produto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e6f0ff;
      color: #333;
    }

    header {
      background-color: #0059b3;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      background-color: #004080;
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 14px 10px;
      display: block;
    }

    nav ul li a:hover {
      background-color: #0066cc;
    }

    .produto {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .produto img {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
  .produto h2 {
      color: #004080;
      margin: 15px 0;
    }

    .produto p {
      font-size: 16px;
    }

    .preco {
      font-size: 20px;
      font-weight: bold;
      color: #009933;
      margin: 10px 0;
    }

    .botao {
      padding: 10px 20px;
      background: #0059b3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .botao:hover {
      background: #003d80;
    }

    footer {
      background-color: #0059b3;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>EMPRESA WHAYAME-LINE</h1>
  </header>

  <nav>
    <ul>
      <li><a href="#">Início</a></li>
      <li><a href="#">Contato</a></li>
      <li><a href="#">Sobre</a></li>
    </ul>
  </nav>

  <div class="produto">
    <img src="https://raw.githubusercontent.com/sauca300-maker/iPhones-/main/images%20(9).jpeg" alt="Imagem do Produto">
    <h2>IPhone 17 Smart</h2>
    <p> 
*Câmera: Tripla* 
*Armazenamento: Até 1TB* 
*Processador: A18 Pro* 
*Tela: 6.7" OLED*</p>
    <p class="preco">1.000.000kz</p>
    <button class="botao">Comprar</button>
  </div>
  

  <footer>
    <p>&copy; 2025 Loja Virtual | Todos os direitos reservados</p>
  </footer>

</body>
</html>
